name: Build and publish

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  storekit-shim:
    name: Build StoreKit 2 shim
    # Swift for iOS can only be compiled with Xcode.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Build xcframework
        run: src/StoreKit2Shim/build-xcframework.sh

      - uses: actions/upload-artifact@v7
        with:
          name: storekit-shim
          path: src/StoreKit2Shim/build/InAppBillingStoreKit.xcframework
          if-no-files-found: error

  build:
    name: Build and pack
    needs: storekit-shim
    # The net10.0-windows target is only added on Windows, and the macOS workload installs there too.
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install workloads
        run: dotnet workload install maui macos

      - uses: actions/download-artifact@v8
        with:
          name: storekit-shim
          path: src/StoreKit2Shim/build/InAppBillingStoreKit.xcframework

      - name: Test StoreKit 2 mapping
        run: dotnet test src/Plugin.InAppBilling.Tests/Plugin.InAppBilling.Tests.csproj

      - name: Compute package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Pack
        run: >
          dotnet pack src/Plugin.InAppBilling/Plugin.InAppBilling.csproj
          -c Release
          -o artifacts
          -p:Version=${{ steps.version.outputs.version }}
          -p:GeneratePackageOnBuild=false
          -p:ContinuousIntegrationBuild=true

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the release gate that replaces the AzDO approvals.
    environment: nuget-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: artifacts

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Exchanges the job's OIDC token for an API key valid for one hour. No stored NuGet secret.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: jamesmontemagno

      # Pushing the .nupkg also pushes its matching .snupkg from the same folder.
      - name: Push package
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=(--generate-notes --repo "$GITHUB_REPOSITORY" --title "$VERSION")
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          # Publishing from the Releases page creates the release before this tag's run starts.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* "${flags[@]}"
          fi
